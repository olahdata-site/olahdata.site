<!DOCTYPE html>

<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Courses | OLAH-DATA</title>

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/my-courses.css"
    >

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>


<!-- ================================= -->
<!-- APP -->
<!-- ================================= -->

<div class="app">


    <!-- ================================= -->
    <!-- SIDEBAR -->
    <!-- ================================= -->

    <aside
        class="sidebar"
        id="sidebar"
    >


        <!-- LOGO -->

        <div class="logo">

            <h2>

                O_D

            </h2>

        </div>


        <!-- MENU -->

        <nav>


            <!-- DASHBOARD -->

            <a
                href="dashboard.html"
            >

                <i
                    class="fas fa-house"
                ></i>

                <span>

                    Dashboard

                </span>

            </a>


            <!-- MY COURSES -->

            <a
                href="my-courses.html"
                class="active"
            >

                <i
                    class="fas fa-book-open"
                ></i>

                <span>

                    My Courses

                </span>

            </a>


            <!-- PROFILE -->

            <a
                href="profile.html"
            >

                <i
                    class="fas fa-user"
                ></i>

                <span>

                    Profile

                </span>

            </a>


            <!-- LOGOUT -->

            <a
                href="#"
                id="logoutBtn"
            >

                <i
                    class="fas fa-right-from-bracket"
                ></i>

                <span>

                    Logout

                </span>

            </a>


        </nav>


    </aside>


    <!-- ================================= -->
    <!-- MOBILE OVERLAY -->
    <!-- ================================= -->

    <div
        class="mobile-overlay"
        id="mobileOverlay"
    ></div>


    <!-- ================================= -->
    <!-- MAIN CONTENT -->
    <!-- ================================= -->

    <main class="content">


        <!-- ================================= -->
        <!-- HEADER -->
        <!-- ================================= -->

        <header class="page-header">


            <!-- MOBILE MENU -->

            <button
                type="button"
                class="mobile-menu-btn"
                id="mobileMenuBtn"
                aria-label="Buka menu"
            >

                ☰

            </button>


            <!-- HEADER TEXT -->

            <div>


                <h1>

                    My Courses

                </h1>


                <p>

                    Lanjutkan perjalanan belajarmu
                    dan pantau progres setiap kelas.

                </p>


            </div>


        </header>


        <!-- ================================= -->
        <!-- COURSE GRID -->
        <!-- ================================= -->

        <section
            class="courses-section"
        >


            <div
                id="myCourseContainer"
                class="course-grid"
            >


                <!--
                    Course akan dibuat otomatis
                    oleh my-courses.js
                -->


                <!-- LOADING -->

                <div
                    class="loading-course"
                >


                    <i
                        class="fa-solid fa-spinner"
                    ></i>


                    <h3>

                        Memuat kelas...

                    </h3>


                    <p>

                        Tunggu sebentar,
                        kelas kamu sedang disiapkan.

                    </p>


                </div>


            </div>


        </section>


    </main>


</div>


<!-- ================================= -->
<!-- JAVASCRIPT -->
<!-- ================================= -->

<script
    src="js/api.js"
></script>


<script
    src="js/my-courses.js"
></script>

<script src="js/api.js"></script>

<script src="js/my-courses.js"></script>
</body>

</html>
