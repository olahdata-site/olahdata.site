<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | OLAH-DATA</title>

    <link rel="stylesheet" href="css/dashboard.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="app">

    <!-- ========================= -->
    <!-- SIDEBAR -->
    <!-- ========================= -->

    <aside class="sidebar" id="sidebar">

        <div class="logo">

            <h2>OD</h2>

        </div>

        <nav>

            <a href="#" class="active">

                <i class="fas fa-house"></i>

                <span>Dashboard</span>

            </a>

            <a href="#">

                <i class="fas fa-book-open"></i>

                <span>My Courses</span>

            </a>

            <a href="#">

                <i class="fas fa-user"></i>

                <span>Profile</span>

            </a>

            <a href="#">

                <i class="fas fa-right-from-bracket"></i>

                <span>Logout</span>

            </a>

        </nav>

    </aside>

    <!-- ========================= -->
    <!-- CONTENT -->
    <!-- ========================= -->

    <main class="content">

        <!-- HEADER -->

        <header class="header">

            <div>

                <h1>

                    Halo,
                    <span id="userName">User</span> 👋

                </h1>

                <p>

                    Selamat datang kembali.

                </p>

            </div>

        </header>

        <!-- ========================= -->
        <!-- REDEEM -->
        <!-- ========================= -->

        <section class="redeem-card">

            <div>

                <h2>🎁 Redeem License</h2>

                <p>

                    Masukkan kode license untuk membuka kelas.

                </p>

            </div>

            <div class="redeem-form">

                <input
                type="text"
                id="licenseCode"
                placeholder="Contoh: EXCEL001">

                <button id="redeemBtn">

                    Redeem

                </button>

            </div>

        </section>

        <!-- ========================= -->
        <!-- MY COURSES -->
        <!-- ========================= -->

        <section class="courses">

            <div class="section-title">

                <h2>

                    My Courses

                </h2>

            </div>

            <div
            id="courseContainer"
            class="course-grid">

                <!-- Dibuat otomatis oleh dashboard.js -->

            </div>

        </section>

    </main>

</div>

<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/redeem.js"></script>

</body>
</html>
